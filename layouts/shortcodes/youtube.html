<figure class="border border-dark rounded youtube">
  <iframe width="560" height="315" src="https://www.youtube.com/embed/{{ .Get "src" }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  <figcaption>図：{{ .Get "desc" }}<cite>（引用元：<a href="https://www.youtube.com/watch?v={{ .Get "src" }}">https://www.youtube.com/watch?v={{ .Get "src" }}</a>）</cite></figcaption>
</figure>
